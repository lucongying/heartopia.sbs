<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#BFD9E4"/>
      <stop offset="55%" stop-color="#AECEDD"/>
      <stop offset="100%" stop-color="#9CC2D3"/>
    </linearGradient>
    <radialGradient id="land" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EEF0D6"/>
      <stop offset="70%" stop-color="#E1E6C4"/>
      <stop offset="100%" stop-color="#D3DAB2"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A6CDDE"/>
      <stop offset="100%" stop-color="#8FB8CE"/>
    </linearGradient>

    <!-- Main island coastline -->
    <path id="island" d="M 165 208 C 195 202 240 196 300 187 C 350 179 400 173 428 170 C 452 168 472 162 486 155 C 498 149 502 146 502 148 C 502 155 510 164 522 172 C 548 182 590 190 640 196 C 695 203 745 214 770 235 C 795 258 815 300 822 360 C 826 430 823 520 815 590 C 809 645 799 675 790 695 C 772 705 740 712 700 716 C 660 726 630 744 612 744 C 594 740 566 734 540 730 C 524 722 512 716 500 712 C 486 726 472 736 460 742 C 452 752 444 760 436 774 C 430 792 425 806 420 818 C 414 812 405 806 398 798 C 394 792 391 786 388 782 C 380 780 366 778 352 774 C 316 762 282 750 250 744 C 222 738 194 726 172 712 C 152 697 148 661 152 621 C 156 579 158 541 157 499 C 156 449 154 401 156 351 C 158 301 162 265 165 208 Z"/>
    <clipPath id="islandClip"><use href="#island"/></clipPath>

    <!-- Glyph: round tree -->
    <g id="tree">
      <circle r="9" fill="#8FB47E"/>
      <circle r="6" cx="-3" cy="-3" fill="#A2C48F"/>
      <line y1="6" y2="13" stroke="#9A7B4F" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Glyph: pine -->
    <g id="pine">
      <path d="M 0 -12 L 7 2 L 3 2 L 8 10 L -8 10 L -3 2 L -7 2 Z" fill="#6E9A5E"/>
      <line y1="10" y2="16" stroke="#8A6B45" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Glyph: rock -->
    <g id="rock">
      <path d="M -6 3 L -4 -3 L 3 -5 L 7 1 L 2 4 Z" fill="#A89685" stroke="#8F7F6E" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ================= Sea ================= -->
  <rect width="1000" height="1000" fill="url(#sea)"/>

  <!-- Wave / current marks -->
  <g stroke="#9DBFD0" stroke-width="2.2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 70 96 q 24 -13 48 0 t 48 0"/>
    <path d="M 720 70 q 24 -12 48 0 t 48 0"/>
    <path d="M 120 872 q 24 -13 48 0 t 48 0 t 48 0"/>
    <path d="M 60 850 q 18 -10 36 0 t 36 0"/>
    <path d="M 52 340 q 20 -11 40 0 t 40 0"/>
    <path d="M 900 640 q 20 -11 40 0 t 40 0"/>
    <path d="M 70 130 q 18 -10 36 0 t 36 0"/>
  </g>

  <!-- Sea labels -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#5F8BA0" font-size="17" font-weight="600" font-style="italic" letter-spacing="1">
    <text x="497" y="60" text-anchor="middle">Ancient Sea</text>
    <text x="110" y="470" text-anchor="middle" transform="rotate(-90 110 470)">Whale Sea</text>
    <text x="478" y="832" text-anchor="middle">Calm Sea</text>
    <text x="778" y="786" text-anchor="middle" transform="rotate(-90 778 786)">Zephyr Sea</text>
  </g>

  <!-- ================= Island land + coast ================= -->
  <use href="#island" fill="url(#land)" stroke="#CFE3EC" stroke-width="22"/>
  <use href="#island" fill="none" stroke="#EDE3BB" stroke-width="12"/>

  <!-- ================= Offshore islands ================= -->
  <!-- Forest island -->
  <g>
    <path d="M 904 306 C 924 296 944 304 949 320 C 954 338 942 358 924 358 C 904 358 890 344 894 326 C 896 316 898 310 904 306 Z"
          fill="url(#land)" stroke="#CFE3EC" stroke-width="14"/>
    <path d="M 904 306 C 924 296 944 304 949 320 C 954 338 942 358 924 358 C 904 358 890 344 894 326 C 896 316 898 310 904 306 Z"
          fill="none" stroke="#EDE3BB" stroke-width="8"/>
    <use href="#tree" transform="translate(914 332) scale(0.85)"/>
    <use href="#tree" transform="translate(932 346) scale(0.7)"/>
    <use href="#tree" transform="translate(936 322) scale(0.75)"/>
    <use href="#tree" transform="translate(922 316) scale(0.6)"/>
    <text x="926" y="300" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#5F5045" text-anchor="middle">Forest Island</text>
  </g>
  <!-- Small islet (south) -->
  <g>
    <ellipse cx="688" cy="792" rx="20" ry="13" fill="url(#land)" stroke="#CFE3EC" stroke-width="10"/>
    <ellipse cx="688" cy="792" rx="20" ry="13" fill="none" stroke="#EDE3BB" stroke-width="5"/>
    <use href="#tree" transform="translate(688 792) scale(0.5)"/>
  </g>
  <!-- Small islet (north-west) -->
  <g>
    <ellipse cx="128" cy="360" rx="16" ry="11" fill="url(#land)" stroke="#CFE3EC" stroke-width="9"/>
    <ellipse cx="128" cy="360" rx="16" ry="11" fill="none" stroke="#EDE3BB" stroke-width="5"/>
  </g>

  <!-- ================= Everything on land (clipped) ================= -->
  <g clip-path="url(#islandClip)">

    <!-- Region washes -->
    <ellipse cx="470" cy="205" rx="185" ry="48" fill="#C3B4A2" opacity="0.55"/>
    <ellipse cx="745" cy="505" rx="88" ry="118" fill="#B5CDA4" opacity="0.7"/>
    <ellipse cx="378" cy="590" rx="62" ry="72" fill="#DFE1A6" opacity="0.6"/>
    <ellipse cx="218" cy="610" rx="52" ry="78" fill="#E7C4D2" opacity="0.65"/>
    <ellipse cx="500" cy="490" rx="86" ry="62" fill="#EBD4BC" opacity="0.75"/>

    <!-- Farm crop rows -->
    <g stroke="#C7CB8A" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="330" y1="568" x2="410" y2="568"/>
      <line x1="334" y1="586" x2="410" y2="586"/>
      <line x1="338" y1="604" x2="410" y2="604"/>
      <line x1="344" y1="622" x2="406" y2="622"/>
      <line x1="350" y1="640" x2="402" y2="640"/>
    </g>

    <!-- Flower dots -->
    <g fill="#E58FB0">
      <circle cx="196" cy="596" r="3"/><circle cx="212" cy="612" r="3"/>
      <circle cx="188" cy="626" r="3"/><circle cx="226" cy="626" r="3"/>
      <circle cx="206" cy="644" r="3"/><circle cx="196" cy="660" r="3"/>
      <circle cx="220" cy="678" r="3"/><circle cx="200" cy="690" r="3"/>
      <circle cx="240" cy="602" r="3"/><circle cx="252" cy="634" r="3"/>
    </g>
    <g fill="#F0B9CD">
      <circle cx="204" cy="604" r="3"/><circle cx="200" cy="636" r="3"/>
      <circle cx="222" cy="620" r="3"/><circle cx="192" cy="674" r="3"/>
      <circle cx="232" cy="656" r="3"/><circle cx="214" cy="688" r="3"/>
    </g>

    <!-- Forest trees -->
    <g>
      <use href="#tree" transform="translate(700 470)"/>
      <use href="#tree" transform="translate(730 490) scale(1.1)"/>
      <use href="#tree" transform="translate(758 460)"/>
      <use href="#tree" transform="translate(780 520) scale(1.2)"/>
      <use href="#tree" transform="translate(796 480)"/>
      <use href="#tree" transform="translate(748 545)"/>
      <use href="#tree" transform="translate(770 505)"/>
      <use href="#tree" transform="translate(805 540)"/>
      <use href="#tree" transform="translate(760 570)"/>
      <use href="#tree" transform="translate(788 560)"/>
      <use href="#tree" transform="translate(742 600) scale(0.9)"/>
      <use href="#tree" transform="translate(772 615)"/>
      <use href="#tree" transform="translate(800 600) scale(0.9)"/>
      <use href="#tree" transform="translate(756 640)"/>
      <use href="#tree" transform="translate(786 645) scale(0.9)"/>
    </g>

    <!-- Pines + rocks (north) -->
    <g>
      <use href="#pine" transform="translate(360 210)"/>
      <use href="#pine" transform="translate(392 196) scale(0.9)"/>
      <use href="#pine" transform="translate(560 205) scale(1.05)"/>
      <use href="#pine" transform="translate(598 220) scale(0.85)"/>
      <use href="#pine" transform="translate(430 218) scale(0.8)"/>
      <use href="#pine" transform="translate(640 225) scale(0.8)"/>
      <use href="#pine" transform="translate(540 196) scale(0.9)"/>
    </g>
    <g>
      <use href="#rock" transform="translate(336 186)"/>
      <use href="#rock" transform="translate(520 190) scale(0.9)"/>
      <use href="#rock" transform="translate(606 200)"/>
      <use href="#rock" transform="translate(668 224) scale(0.85)"/>
      <use href="#rock" transform="translate(310 240) scale(0.8)"/>
    </g>

    <!-- Rivers (inland, connecting lakes to coasts) -->
    <g stroke="url(#water)" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M 394 190 C 380 220 350 270 326 320 C 316 340 312 360 318 390 C 324 420 336 446 352 470"/>
      <path d="M 520 452 C 528 480 532 505 530 530 C 528 552 524 572 516 592 C 508 610 502 622 500 634"/>
      <path d="M 706 296 C 694 314 674 330 652 344 C 630 358 614 366 606 380 C 596 396 590 412 592 428"/>
      <path d="M 330 620 C 344 640 356 654 368 669 C 380 684 396 698 412 712 C 424 724 432 736 436 748"/>
      <path d="M 600 640 C 610 652 620 662 627 674 C 634 686 644 696 654 700 C 664 706 672 714 676 724"/>
    </g>

    <!-- Lakes -->
    <g fill="url(#water)" stroke="#86AFC6" stroke-width="2">
      <ellipse cx="232" cy="536" rx="27" ry="19"/>
      <ellipse cx="481" cy="608" rx="23" ry="16"/>
      <ellipse cx="748" cy="598" rx="27" ry="19"/>
      <ellipse cx="774" cy="431" rx="19" ry="14"/>
      <ellipse cx="537" cy="265" rx="21" ry="15"/>
      <ellipse cx="394" cy="176" rx="23" ry="16"/>
    </g>
    <g fill="#C9E2EC" opacity="0.7">
      <ellipse cx="228" cy="532" rx="10" ry="5"/>
      <ellipse cx="477" cy="604" rx="8" ry="4"/>
      <ellipse cx="744" cy="594" rx="10" ry="5"/>
      <ellipse cx="533" cy="261" rx="8" ry="4"/>
    </g>

    <!-- Roads -->
    <g stroke="#D8C6AE" stroke-width="2.6" fill="none" stroke-dasharray="7 6" opacity="0.95">
      <path d="M 492 538 C 470 545 440 555 418 572 C 408 582 406 588 406 602"/>
      <path d="M 492 538 C 496 560 500 600 506 656 C 508 672 508 682 506 700"/>
      <path d="M 492 538 C 530 545 590 548 660 548 C 710 548 748 545 780 540"/>
      <path d="M 470 545 C 448 540 428 530 412 520"/>
      <path d="M 530 545 C 552 550 580 550 610 546"/>
    </g>

    <!-- Town buildings -->
    <g fill="#D9A97C" stroke="#B98A5E" stroke-width="1.5">
      <rect x="482" y="496" width="16" height="14"/>
      <rect x="502" y="492" width="16" height="18"/>
      <rect x="522" y="500" width="14" height="12"/>
      <rect x="470" y="516" width="14" height="12"/>
      <rect x="540" y="516" width="14" height="12"/>
      <rect x="556" y="482" width="13" height="11"/>
      <rect x="452" y="496" width="13" height="11"/>
      <rect x="585" y="498" width="13" height="11"/>
    </g>
    <g fill="#A8704A" stroke="#8F5E3C" stroke-width="1">
      <path d="M 480 496 l 10 -6 l 10 6 z"/>
      <path d="M 500 492 l 10 -7 l 10 7 z"/>
      <path d="M 520 500 l 8 -5 l 8 5 z"/>
      <path d="M 468 516 l 8 -5 l 8 5 z"/>
      <path d="M 538 516 l 8 -5 l 8 5 z"/>
    </g>

    <!-- Village buildings -->
    <g fill="#D9A97C" stroke="#B98A5E" stroke-width="1.5">
      <rect x="468" y="682" width="14" height="12"/>
      <rect x="488" y="678" width="14" height="16"/>
      <rect x="520" y="684" width="13" height="12"/>
      <rect x="544" y="688" width="12" height="10"/>
    </g>
    <g fill="#A8704A" stroke="#8F5E3C" stroke-width="1">
      <path d="M 466 682 l 8 -5 l 8 5 z"/>
      <path d="M 486 678 l 8 -6 l 8 6 z"/>
      <path d="M 518 684 l 7 -4 l 7 4 z"/>
    </g>

    <!-- Rocky cliff striations -->
    <g stroke="#9C8C7B" stroke-width="2" opacity="0.6" stroke-linecap="round">
      <path d="M 620 214 l 6 16 M 632 222 l 5 14 M 644 230 l 5 12"/>
    </g>

    <!-- Hot spring steam -->
    <g stroke="#EAF4F6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 528 258 q -4 -8 0 -16 q 4 -8 0 -16"/>
      <path d="M 544 254 q -4 -8 0 -16 q 4 -8 0 -16"/>
      <path d="M 536 262 q -3 -6 0 -12 q 3 -6 0 -12"/>
    </g>

    <!-- Ruins (columns) -->
    <g transform="translate(291 184)" fill="#C0B19C" stroke="#A6927C" stroke-width="1.2">
      <rect x="-16" y="-14" width="8" height="28"/>
      <rect x="-2" y="-16" width="8" height="30"/>
      <rect x="12" y="-12" width="8" height="24"/>
      <path d="M -18 -14 l 12 0 M -4 -16 l 12 0 M 10 -12 l 12 0" stroke="#A6927C" stroke-width="1.5"/>
    </g>

    <!-- Windmill -->
    <g transform="translate(600 600)">
      <rect x="-5" y="0" width="10" height="18" fill="#E0D6BE" stroke="#B9A582" stroke-width="1.2"/>
      <path d="M 0 0 L 0 -16 M 0 0 L 13 -8 M 0 0 L -13 -8 M 0 0 L 0 12"
            stroke="#C0A67C" stroke-width="3" stroke-linecap="round"/>
      <circle r="3" fill="#8A6B45"/>
    </g>

    <!-- Region + landmark labels -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#5F5045">
      <text x="492" y="522" font-size="21" font-weight="700" text-anchor="middle">Central Plaza</text>
      <text x="506" y="676" font-size="20" font-weight="700" text-anchor="middle">Fishing Village</text>
      <text x="185" y="628" font-size="20" font-weight="700" text-anchor="middle">Flower Fields</text>
      <text x="805" y="512" font-size="20" font-weight="700" text-anchor="middle">Oak Forest</text>
      <text x="501" y="248" font-size="19" font-weight="700" text-anchor="middle">Hot Spring</text>
      <text x="184" y="424" font-size="18" font-weight="700" text-anchor="middle">Whale Mountain</text>
      <text x="406" y="570" font-size="18" font-weight="700" text-anchor="middle">Suburbs</text>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#8A7868" font-size="14.5" font-weight="600">
      <text x="627" y="248" text-anchor="middle">Rocky Cliff</text>
      <text x="291" y="206" text-anchor="middle">Ruins</text>
      <text x="208" y="742" text-anchor="middle">Violet Beach</text>
      <text x="232" y="514" text-anchor="middle">Meadow Lake</text>
      <text x="537" y="284" text-anchor="middle">Hot Spring Lake</text>
      <text x="748" y="578" text-anchor="middle">Forest Lake</text>
      <text x="481" y="588" text-anchor="middle">Suburb Lake</text>
      <text x="774" y="412" text-anchor="middle">Upper Forest Lake</text>
      <text x="394" y="156" text-anchor="middle">Volcano Lake</text>
      <text x="600" y="620" text-anchor="middle">Windmill</text>
      <text x="402" y="706" text-anchor="middle">The Pier</text>
      <text x="602" y="756" text-anchor="middle">East Dock</text>
    </g>

    <!-- River labels -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#6E93A5" font-size="12.5" font-style="italic" font-weight="600">
      <text x="330" y="352" text-anchor="middle">Aurora River</text>
      <text x="548" y="520" text-anchor="middle">Rosy River</text>
      <text x="348" y="652" text-anchor="middle" transform="rotate(-70 348 652)">Quiet River</text>
      <text x="664" y="316" text-anchor="middle">Shallow River</text>
      <text x="598" y="652" text-anchor="middle">Giant Tree River</text>
    </g>
  </g>

  <!-- ================= Coastal landmarks ================= -->

  <!-- Village docks + boats (bay) -->
  <g stroke="#B98A5E" stroke-width="3.5" stroke-linecap="round">
    <line x1="498" y1="700" x2="496" y2="722"/>
    <line x1="514" y1="706" x2="516" y2="726"/>
  </g>
  <g>
    <path d="M 502 716 q 8 -4 16 0 l -4 8 l -16 0 z" fill="#C87D5C" stroke="#A8623F" stroke-width="1.2"/>
    <path d="M 522 720 q 7 -4 14 0 l -3 7 l -14 0 z" fill="#C87D5C" stroke="#A8623F" stroke-width="1.2"/>
  </g>

  <!-- Lighthouse + beam -->
  <g>
    <rect x="379" y="756" width="9" height="18" fill="#E8E2D2" stroke="#B98A5E" stroke-width="1.5"/>
    <rect x="375" y="752" width="17" height="7" fill="#C75E4A" stroke="#A84C3B" stroke-width="1"/>
    <path d="M 392 764 L 448 758 L 392 774 Z" fill="#F4E9C8" opacity="0.5"/>
  </g>
  <text x="387" y="802" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#8A7868" text-anchor="middle">Lighthouse</text>

  <!-- ================= Compass rose ================= -->
  <g transform="translate(72,72)">
    <circle r="34" fill="#FBF7EE" fill-opacity="0.75" stroke="#8A7868" stroke-width="1.5"/>
    <circle r="34" fill="none" stroke="#8A7868" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.6"/>
    <path d="M 0 -26 L 8 6 L 0 2 L -8 6 Z" fill="#C75E4A"/>
    <path d="M 0 26 L 8 -6 L 0 -2 L -8 -6 Z" fill="#9FB8A8"/>
    <path d="M -26 0 L 6 -8 L 2 0 L 6 8 Z" fill="#D9B96A"/>
    <path d="M 26 0 L -6 -8 L -2 0 L -6 8 Z" fill="#9FB8A8"/>
    <circle r="3" fill="#5F5045"/>
    <text x="0" y="-40" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6B5A4E" text-anchor="middle">N</text>
  </g>

  <!-- ================= Scale bar ================= -->
  <g transform="translate(40,942)" font-family="system-ui, sans-serif" fill="#5F5045">
    <!-- alternating segments -->
    <rect x="0" y="0" width="60" height="6" fill="#5F5045" opacity="0.82"/>
    <rect x="60" y="0" width="60" height="6" fill="#FFFFFF" opacity="0.6"/>
    <rect x="0" y="0" width="120" height="6" fill="none" stroke="#5F5045" stroke-width="1.2"/>
    <!-- ticks -->
    <line x1="0" y1="0" x2="0" y2="11" stroke="#5F5045" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="11" stroke="#5F5045" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="11" stroke="#5F5045" stroke-width="2"/>
    <!-- labels -->
    <text x="0" y="26" text-anchor="middle" font-size="12">0</text>
    <text x="60" y="26" text-anchor="middle" font-size="12">0.5</text>
    <text x="120" y="26" text-anchor="middle" font-size="12">1 km</text>
  </g>
</svg>
