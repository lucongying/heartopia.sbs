<script>
var HEADERS = {
  fish:    ['名称','位置','季节','天气','时间','稀有度','售价','建议'],
  insects: ['名称','位置','天气','时间','稀有度','售价'],
  birds:   ['名称','位置','季节','天气','时间','稀有度','观鸟等级'],
  recipes: ['名称','材料','能量','售价','★★','利润','解锁'],
  crops:   ['名称','生长','季节','售价','收益/h','优先级'],
  npcs:    ['名称','角色','位置','出没时间','解锁条件','喜好礼物'],
  achievements: ['名称','类别','描述','解锁条件','奖励'],
  scores:  ['名称','来源','乐器','难度','解锁']
};
function updateTableHead(tab) {
  var head = document.getElementById('table-head');
  if (!head) return;
  var cols = HEADERS[tab] || HEADERS.fish;
  head.innerHTML = '<tr>' + cols.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr>';
}
;(async function init() {
  var grid = document.getElementById('data-grid');
  if (!grid) return;
  grid.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-dim)">' + window.I18N.t('db.loading') + '</div>';
  try { await loadData(['birds']); } catch (e) {
    console.error('数据加载失败:', e);
    grid.innerHTML = '<div style="text-align:center;padding:30px;color:var(--coral)">' + window.I18N.t('common.loadFailed') + '</div>';
    document.getElementById('result-count').textContent = window.I18N.t('db.loadFailed');
    return;
  }
  currentTab = 'birds';
  applyFilters();
})();
</script>
